# Build FreeCellHD.exe and SolitaireHD.exe (mingw-w64 i686, msvcrt.dll) on the shared engine, run the
# native tests (engine and games) and the XP import check on every push and pull request; on a v* tag
# also publish a GitHub Release with both exes.
# Local equivalents: make release && make test && make xpcheck (see README.md).
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build, test, XP import check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install mingw-w64 (i686)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gcc-mingw-w64-i686 binutils-mingw-w64-i686
          i686-w64-mingw32-gcc --version | head -n 1
          gcc --version | head -n 1

      # Ubuntu's GCC 13 has no -mcrtdll; the Makefile then relies on its msvcrt.dll default (see Makefile).
      - name: Build build/FreeCellHD.exe and build/SolitaireHD.exe (stripped; runs the XP import check)
        run: make -j"$(nproc)" release

      # GCC 13's ASan can crash at start-up with the kernel's 32-bit mmap randomisation; 28 bits is safe.
      - name: Native unit tests, engine and games (ASan + UBSan)
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28
          make -j"$(nproc)" test

      - name: XP import check
        run: make xpcheck

      - name: Board snapshots
        run: make snapshots

      - name: Summary
        run: |
          {
            echo "### Executables"
            echo
            echo "| exe | size | SHA-256 |"
            echo "|---|---|---|"
            for exe in build/FreeCellHD.exe build/SolitaireHD.exe; do
              echo "| $(basename "$exe") | $(stat -c %s "$exe") bytes | \`$(sha256sum "$exe" | cut -d' ' -f1)\` |"
            done
            echo
            echo "toolchain: $(i686-w64-mingw32-gcc --version | head -n 1)"
          } >> "$GITHUB_STEP_SUMMARY"

      # one artifact with both exes (stored without the build/ prefix)
      - uses: actions/upload-artifact@v7
        with:
          name: exes
          path: |
            build/FreeCellHD.exe
            build/SolitaireHD.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: snapshots
          path: build/snapshots/*.png
          retention-days: 14

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # checkout may turn an annotated tag into a lightweight one; fetch the tag object itself
      - name: Fetch the tag
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - uses: actions/download-artifact@v8
        with:
          name: exes
          path: dist

      # Each game has its own version (FreeCell HD 1.3, Solitaire HD 1.1, ...); a release tag names the
      # version of the game it is about, so it must match one of them. Both are listed in the log.
      - name: Check the tag against the exes' version resources
        run: |
          want=${GITHUB_REF_NAME#v}
          want=${want%%-*}
          norm() { echo "$1.0.0.0" | cut -d. -f1-4; }
          match=
          for rc in res/freecell/freecell.rc res/solitaire/solitaire.rc; do
            have=$(sed -n 's/.*VALUE "ProductVersion", *"\([0-9.]*\)".*/\1/p' "$rc" | head -n 1)
            echo "$rc: ProductVersion ${have:-missing}"
            if [ -z "$have" ]; then
              echo "::warning file=$rc::no ProductVersion"
            elif [ "$(norm "$want")" = "$(norm "$have")" ]; then
              match=$rc
            fi
          done
          if [ -z "$match" ]; then
            echo "::warning::tag ${GITHUB_REF_NAME} matches neither exe's ProductVersion"
          fi

      - name: Release notes
        run: tools/ci/release_notes.sh "$GITHUB_REF_NAME" dist/FreeCellHD.exe dist/SolitaireHD.exe | tee notes.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/FreeCellHD.exe dist/SolitaireHD.exe --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/FreeCellHD.exe dist/SolitaireHD.exe --verify-tag $pre \
              --title "xp-cards ${GITHUB_REF_NAME}: FreeCell HD, Solitaire HD" --notes-file notes.md --generate-notes
          fi

  # Optional end-to-end smoke test under Wine (32-bit) and a virtual X display. Informational for now:
  # it does not fail the workflow.
  e2e-wine:
    name: Wine smoke test (informational)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: exes
          path: build

      - name: Install Wine (32-bit), Xvfb, openbox, ImageMagick, mingw-w64
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends wine wine32:i386 wine64 xvfb xauth openbox \
            imagemagick gcc-mingw-w64-i686 binutils-mingw-w64-i686
          wine --version

      # run.sh builds the driver (fcdrive.exe + fchook.dll) and the prefix (build/wineprefix-e2e).
      # The screen is larger than 1080p so the scenario's 1904x996 client fits; a window manager is
      # needed to restore a window that starts maximized.
      - name: Smoke scenario (FreeCell HD)
        run: |
          xvfb-run -a -s "-screen 0 2560x1600x24" \
            tools/ci/xvfb_wm.sh tools/wine/run.sh -o build/e2e/smoke tests/e2e/fchd_smoke.txt

      - name: Smoke scenario (Solitaire HD)
        if: always()
        run: |
          SOLHD_NO_WARP=1 xvfb-run -a -s "-screen 0 2560x1600x24" \
            tools/ci/xvfb_wm.sh tools/wine/run.sh -o build/e2e/solhd tests/e2e/solhd_smoke.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-smoke-captures
          path: |
            build/e2e/smoke
            build/e2e/solhd
          retention-days: 14
